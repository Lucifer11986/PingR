<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
  <title>Nokki – Verbindung unterbrochen</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090f;color:#f8fafc;font:15px system-ui,sans-serif}.card{width:min(420px,calc(100% - 32px));padding:36px;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:#10121c;box-shadow:0 24px 80px rgba(0,0,0,.4)}img{width:84px;height:84px;border-radius:22px}h1{margin:20px 0 8px;font-size:24px}p{margin:0 0 24px;color:#a8b0bf;line-height:1.5}button{border:0;border-radius:10px;padding:11px 18px;background:#e8b86d;color:#17120a;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/icon.png" alt="Nokki">
    <h1>Keine Verbindung</h1>
    <p>Nokki konnte den Server nicht erreichen. Prüfe deine Internetverbindung und versuche es erneut.</p>
    <button id="retry" type="button">Erneut versuchen</button>
  </main>
  <script>
    const retry = new URLSearchParams(location.search).get('retry') || 'https://lumestack.de/chat'
    document.getElementById('retry').addEventListener('click', () => { location.href = retry })
  </script>
</body>
</html>
