# HTTP-only Version (Mikrofon nur auf localhost!)
# Für HTTPS: nginx.conf verwenden

upstream frontend { server frontend:80; }
upstream backend  { server backend:4000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    location = / {
        proxy_pass http://frontend/landing.html;
        proxy_set_header Host $host;
    }
    location = /landing.html {
        proxy_pass http://frontend/landing.html;
        proxy_set_header Host $host;
    }
    location = /admin {
        proxy_pass http://frontend/admin.html;
        proxy_set_header Host $host;
    }
    location = /app { return 302 /login; }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    location /uploads/ {
        proxy_pass http://backend/uploads/;
    }
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}