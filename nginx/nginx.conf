# /opt/pingr/nginx/nginx.conf
# Wird als /etc/nginx/conf.d/default.conf gemountet
# events{} und http{} kommen aus dem nginx-Image selbst

# ── Security Headers (global) ─────────────────────────────────────────────
add_header X-Frame-Options           "SAMEORIGIN"   always;
add_header X-Content-Type-Options    "nosniff"      always;
add_header X-XSS-Protection          "0" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=()" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# HSTS: Browser merkt sich für 1 Jahr dass nur HTTPS erlaubt ist
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ── Rate Limiting ─────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

# ── HTTP → HTTPS Redirect (Port 80) ──────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name lumestack.de;

  # Certbot ACME-Challenge (für Zertifikatserneuerung)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Alles andere → HTTPS
  location / {
    return 301 https://lumestack.de$request_uri;
  }
}

# ── HTTPS Hauptserver ─────────────────────────────────────────────────────
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name lumestack.de;

  # UTF-8 für Emojis
  charset utf-8;

  # ── TLS Zertifikate (Let's Encrypt) ──────────────────────────────────────
  ssl_certificate     /etc/letsencrypt/live/lumestack.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lumestack.de/privkey.pem;

  # ── TLS Best Practices ────────────────────────────────────────────────────
  # Nur moderne TLS-Versionen (TLS 1.2 und 1.3)
  ssl_protocols             TLSv1.2 TLSv1.3;

  # Nur sichere Cipher Suites (kein RC4, kein 3DES, kein MD5)
  ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;

  # Session-Wiederverwendung (Performance)
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP Stapling (schnellere Zertifikatsprüfung)
  ssl_stapling        on;
  ssl_stapling_verify on;
  resolver            8.8.8.8 8.8.4.4 valid=300s;
  resolver_timeout    5s;

  # DH-Parameter (perfect forward secrecy)
  # Einmalig generieren: openssl dhparam -out /etc/nginx/dhparam.pem 2048
  ssl_dhparam         /etc/nginx/dhparam.pem;

  # ── Proxy-IP weitergeben ─────────────────────────────────────────────────
  proxy_set_header X-Real-IP        $remote_addr;
  proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host             $http_host;

  # ══════════════════════════════════════════════════════════════════════════
  # WICHTIG: Spezifische Locations ZUERST, dann / als Fallback!
  # ══════════════════════════════════════════════════════════════════════════

  # ── API: Rate Limiting + Proxy ────────────────────────────────────────────
  location /api/ {
    limit_req zone=api burst=50 nodelay;
    proxy_pass         http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Host              $http_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Auth-Endpunkte: strengeres Rate Limiting
  location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass         http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Datei-Upload: eigenes Limit
  location /api/files {
    limit_req         zone=upload burst=3 nodelay;
    client_max_body_size 50m;
    proxy_pass        http://backend:4000;
    proxy_http_version 1.1;
  }

  # ── WebSocket (Socket.IO) ─────────────────────────────────────────────────
  location /socket.io/ {
    proxy_pass         http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_read_timeout 86400s;
  }

  # ── Uploads (User-Dateien) ────────────────────────────────────────────────
  location /uploads/ {
    proxy_pass       http://backend:4000;
    proxy_http_version 1.1;
    expires          off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  # ── Admin-Panel → direkt admin.html ausliefern ───────────────────────────
  # ── Desktop-Installer ─────────────────────────────────────────────
  location ^~ /downloads/ {
    alias /var/www/downloads/;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /admin {
    proxy_pass         http://frontend:80/admin.html;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
  }
  location = /admin.html {
    proxy_pass         http://frontend:80/admin.html;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
  }

  # ── Certbot ACME-Challenge ────────────────────────────────────────────────
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # ── Direkte Datei-Anfragen blockieren ─────────────────────────────────────
  location ~ /\. {
    deny all;
  }

  # ══════════════════════════════════════════════════════════════════════════
  # ── Static Files → Frontend-Container (MUSS GANZ AM ENDE SEIN!) ──────────
  # ══════════════════════════════════════════════════════════════════════════
  # Diese location matched ALLE Pfade die nicht oben abgefangen wurden
  location / {
    proxy_pass         http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
  }
}
