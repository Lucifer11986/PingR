upstream frontend { server frontend:80; }
upstream backend  { server backend:4000; }

server {
    listen 80;
    server_name lumestack.de www.lumestack.de;

    # ACME Challenge durchleiten
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Alles andere normal weiterleiten
    location = /  { proxy_pass http://frontend/landing.html;     proxy_set_header Host $host; }
    location = /landing.html     { proxy_pass http://frontend/landing.html;     proxy_set_header Host $host; }
    location = /datenschutz.html { proxy_pass http://frontend/datenschutz.html; proxy_set_header Host $host; }
    location = /impressum.html   { proxy_pass http://frontend/impressum.html;   proxy_set_header Host $host; }
    location = /agb.html         { proxy_pass http://frontend/agb.html;         proxy_set_header Host $host; }
    location = /admin            { proxy_pass http://frontend/admin.html;        proxy_set_header Host $host; }
    location /chat     { proxy_pass http://frontend; proxy_set_header Host $host; }
    location /login    { proxy_pass http://frontend; proxy_set_header Host $host; }
    location /register { proxy_pass http://frontend; proxy_set_header Host $host; }
    location /api/     { proxy_pass http://backend;  proxy_set_header Host $host; }
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /uploads/ { proxy_pass http://backend/uploads/; proxy_set_header Host $host; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; }
}
